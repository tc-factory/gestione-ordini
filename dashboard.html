<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#2B2B2E">
  <title>Gestionale Ordini — T&C Factory</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/theme-cornice.css">
</head>
<body>
  <a class="skip-link" href="#main-content">Vai al contenuto</a>

  <div class="app-shell">
    <!-- Navbar laterale -->
    <aside class="sidebar glass" id="sidebar-root" aria-label="Navigazione principale"></aside>
    <div class="sidebar-scrim" onclick="Nav.closeDrawer()"></div>
    <!-- Solo smartphone: navigazione in basso -->
    <nav class="bottom-nav glass" id="bottomnav-root" aria-label="Navigazione principale"></nav>

    <main class="app-main" id="main-content">
      <header class="app-toolbar glass" id="header-root"></header>

      <section class="view" id="view-planner" data-view="planner" hidden>
        <div id="calendar-root"></div>
      </section>

      <section class="view" id="view-ordini" data-view="ordini" hidden>
        <div class="stat-grid" id="stats-root"></div>
        <div id="orderlist-root"></div>
      </section>

      <section class="view" id="view-clienti" data-view="clienti" hidden>
        <div id="clienti-root"></div>
      </section>

      <section class="view" id="view-cassa" data-view="cassa" hidden>
        <div id="economic-root"></div>
      </section>

      <section class="view" id="view-staff" data-view="staff" hidden>
        <div id="staff-root"></div>
      </section>

      <section class="view" id="view-impostazioni" data-view="impostazioni" hidden>
        <div id="settings-root"></div>
      </section>

      <section class="view" id="view-cestino" data-view="cestino" hidden>
        <div id="cestino-root"></div>
      </section>

      <section class="view" id="view-supporto" data-view="supporto" hidden>
        <div id="supporto-root"></div>
      </section>
    </main>
  </div>

  <div id="order-form-modal" class="modal-overlay"></div>
  <div id="order-detail-modal" class="modal-overlay"></div>
  <div id="day-modal" class="modal-overlay"></div>
  <div id="file-preview-modal" class="modal-overlay"></div>
  <div id="cal-event-modal" class="modal-overlay"></div>
  <div id="client-form-modal" class="modal-overlay"></div>
  <div id="client-link-modal" class="modal-overlay"></div>
  <div id="more-sheet" class="modal-overlay"></div>
  <div id="pwd-modal" class="modal-overlay"></div>

  <!-- Login overlay — visibile finché non si è autenticati -->
  <div id="login-overlay" class="login-overlay" style="display:none;"></div>
  <div id="toast-container" class="toast-container" role="status" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/data.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.6.0/jspdf.plugin.autotable.min.js"></script>
  <script src="js/app.js"></script>
  <script src="js/clienti.js"></script>
  <script src="js/cassa.js"></script>
  <script src="js/supporto.js"></script>
  <script src="js/nav.js"></script>
  <script>
    Theme.init();
    TCFactory.onUpdate(() => { if (TCAuth.isLoggedIn()) renderApp(); });

    // Sessione Supabase salvata → entra direttamente; altrimenti login
    TCAuth.init().then(() => TCAuth.isLoggedIn() ? startApp() : renderLoginScreen());
  </script>
</body>
</html>
